# MORODER
#
# Lives at ~/.config/moroder/moroder.conf
# Format is KEY = value. Text and paths go in quotes, # starts a comment.
# Delete any line to fall back to its built-in default.
#
# Run `moroder setup` to sign in. It fills in BROWSER and the two cookie paths
# below and leaves everything else in this file alone.


# --- ACCOUNT ----------------------------------------------------------------

# Which browser holds your YouTube Music session.
#   firefox, librewolf, floorp, waterfox, zen, mercury, icecat, tor,
#   chrome, chromium, brave, edge, opera, vivaldi, whale
BROWSER = "firefox"

# Directory holding browser.json, the YouTube Music session headers.
YTM_COOKIES_PATH = "~/.config/moroder"

# Browser profile directory, the one holding cookies.sqlite. Passed to yt-dlp
# along with BROWSER when a stream is opened. Required for the Firefox forks,
# which are indistinguishable from Firefox by name alone; stock Firefox and the
# Chromium browsers find their default profile without it.
# Without working stream cookies, age-restricted and premium tracks will not play.
MPV_COOKIES_PATH = ""

# Optional. Album names come from last.fm when a key is present, iTunes when
# it is not. Free key: https://www.last.fm/api/account/create
LASTFM_API_KEY = ""


# --- PLAYBACK ---------------------------------------------------------------

# Fetch album details for tracks that arrive without them from the YouTube
# Music API, falling back to last.fm and then iTunes. Costs an extra request
# per track, so turn it off if queueing feels slow.
FETCH_ALBUMS = true

# How many results a search and a radio return.
SEARCH_RESULT_LIMIT = 40
RADIO_RESULT_LIMIT = 50


# --- APPEARANCE -------------------------------------------------------------

# Home page categories in display order, case-insensitive. Anything not listed
# follows in the order YouTube Music sent it.
HOME_ORDER = "from your library, quick picks, forgotten favorites, listen again, morning sunshine"

# Extra line of padding under the player, for terminals that clip the last row.
EXTRA_BOTTOM_PADDING = false

# Colours, as {r, g, b} with each channel 0-255. A malformed or out of range
# value keeps the built-in, so a typo dims one element instead of leaving the
# interface unreadable. Needs a terminal with truecolour support.

# Progress bar, selected filter chips.
COLOR_ACCENT_PRIMARY = {255, 0, 0}

# Titles: the item under the cursor, and everything else.
COLOR_TEXT_TOP_PRIMARY = {255, 255, 255}
COLOR_TEXT_TOP_SECONDARY = {170, 170, 170}

# Second line under a title, same two states.
COLOR_TEXT_BOTTOM_PRIMARY = {170, 170, 170}
COLOR_TEXT_BOTTOM_SECONDARY = {70, 70, 70}

# Separators and chip outlines, focused and unfocused.
COLOR_SEPARATOR_PRIMARY = {100, 100, 100}
COLOR_SEPARATOR_SECONDARY = {50, 50, 50}


# --- CACHE ------------------------------------------------------------------

# Counts, not bytes. Raise them if covers you have already seen get fetched
# again, lower them on a memory-constrained machine.

# Full-size covers held in memory.
MAX_IMAGE_CACHE_SIZE = 800

# Resized variants of those covers.
MAX_RESIZED_IMAGE_CACHE_SIZE = 3200

# Rendered character-art frames.
MAX_IMAGE_CHAR_CACHE_SIZE = 800000

# Cover downloads allowed to run at once.
MAX_CONCURRENT_IMAGE_LOADS = 200


# --- DISCORD ----------------------------------------------------------------

# Show what you are listening to as a Discord status. When false, no Discord
# client is created and no background thread runs.
ENABLE_DISCORD_RICH_PRESENCE = true

# Which field Discord shows as the headline: song, artist or album.
RICH_PRESENCE_STATUS_LABEL = "song"


# --- KEYBINDS ---------------------------------------------------------------

# A single character ("q", "/"), a named key, or "ctrl+<letter>".
# Named keys: space, enter, tab, escape, backspace, delete,
#             up, down, left, right, home, end, pageup, pagedown
# Set a binding to "" to unbind it.

KEY_QUIT = "q"                  # Exit Moroder
KEY_QUEUE_VIEW = "a"            # Show the queue, while something is playing
KEY_TOGGLE_SIDEBAR = "s"        # Hide or show the playlist sidebar
KEY_FOCUS_SEARCH = "f"          # Jump into the search bar
KEY_SKIP_BACKWARD = "z"         # Previous track
KEY_SKIP_FORWARD = "x"          # Next track
KEY_TOGGLE_PAUSE = "space"      # Play / pause
KEY_TOGGLE_LOOP = "r"           # Cycle looping: off, queue, current track

# These act on whatever the cursor is over.
KEY_PLAY_NOW = "enter"          # Play now, replacing the queue and starting a radio
KEY_ADD_TO_QUEUE = "d"          # Append to the queue, leaving playback alone
KEY_REMOVE_FROM_QUEUE = "c"     # Remove from the queue, queue view only
