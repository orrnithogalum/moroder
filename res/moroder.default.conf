# Config options

# APPEARANCE
# - colors?                     color list (by rgb)                     color defaults
# - loading animations?         animation list (by string name)         animation defaults
# - icons?                      icon (string)                           icon defaults

# Order in which home page categories appear. Case-insensitive. Categories not listed here appear after, in API order.
# HOME_ORDER = "from your library, quick picks, forgotten favorites, listen again, morning sunshine"

# PATHS:
# PYTHON_PATH      = "..."      path (string)                           /usr/bin/python
# YTM_COOKIES_PATH = "..."      path (string)                           ~/.config/moroder
# MPV_COOKIES_PATH = "..."      path (string)                           empty

# NETWORK
# - FETCH_ALBUMS                yes / no                                yes
# - SEARCH_RESULT_LIMIT         int                                     40
# - RADIO_RESULT_LIMIT          int                                     10

# API KEYS
# LASTFM_API_LEY = "25de..."    string                                  none

# DISCORD
# - enable
# - status label                album / title / artist string           artist



# Keybinds. Single characters ("q", "/"), a named key, or "ctrl+<letter>".
# Named keys: space, enter, tab, escape, backspace, delete, up, down, left, right, home, end, pageup, pagedown
# Leave a value empty ("") to unbind the action.

KEY_QUIT="q"                  # Exit Moroder
KEY_QUEUE_VIEW="a"            # Show the queue (only while something is playing)
KEY_TOGGLE_SIDEBAR="s"        # Hide or show the playlist sidebar
KEY_FOCUS_SEARCH="f"          # Jump into the search bar
KEY_SKIP_BACKWARD="z"         # Previous track
KEY_SKIP_FORWARD="x"          # Next track
KEY_TOGGLE_PAUSE="space"      # Play / pause

# These apply to the item under the cursor
KEY_PLAY_NOW="enter"          # Play now, replacing the queue and starting a radio
KEY_ADD_TO_QUEUE="d"          # Append to the queue, leaving playback alone
KEY_REMOVE_FROM_QUEUE="c"     # Remove from the queue (queue view only)
