name: Release

# You decide the version. Tag it locally, push the tag, and CI builds and
# uploads the artifacts. Nothing is ever released without you asking for it.
#
#   git tag -a v1.2.0 -m "Queue reordering, MPRIS seek fixes"
#   git push origin v1.2.0
#
# Or use Actions -> Release -> Run workflow and type a version, which tags the
# current commit of the branch you pick.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (with or without the v)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # needed to create the release and, for manual runs, the tag

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      DEBIAN_FRONTEND: noninteractive
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Install system packages
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates wget gpg git openssh-client \
            build-essential gcc-12 g++-12 ninja-build ccache pkg-config \
            libmpv-dev libcurl4-openssl-dev libsystemd-dev libx11-dev xxd binutils
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y --no-install-recommends cmake

      - name: Install Tinyxxd
        run: |
          set -eux
          git clone --depth 1 --branch v1.3.16 \
            https://github.com/xyproto/tinyxxd /tmp/tinyxxd
          cc -std=c11 -O2 -o /usr/local/bin/xxd /tmp/tinyxxd/main.c
          printf 'probe' > /tmp/probe
          xxd -i -n probe_test /tmp/probe | head -1   # must not print a usage dump

      # Work out the version before anything else, so a malformed input fails
      # in two seconds rather than after a full build.
      - name: Resolve version
        id: ver
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ inputs.version }}"
          else
            raw="${{ github.ref_name }}"
          fi
          version="${raw#v}"

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$raw' is not a semantic version (expected 1.2.3 or v1.2.3)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Discord Social SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DISCORD_SDK_REPO }}
          ssh-key: ${{ secrets.DISCORD_SDK_DEPLOY_KEY }}
          path: lib/discord_social_sdk

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore dependency sources
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-jammy-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-jammy-

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-release-${{ github.sha }}
          restore-keys: ccache-release-

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMORODER_VERSION="${{ steps.ver.outputs.version }}" \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the binary
        run: |
          set -eux
          test -f build/moroder
          test -f build/libdiscord_partner_sdk.so
          readelf -d build/moroder | grep -E 'RPATH|RUNPATH'
          ldd build/moroder
          # Highest glibc version the binary demands. Should be <= 2.35.
          objdump -T build/moroder | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eux
          pkg="moroder-${VERSION}-linux-x86_64"
          mkdir -p "dist/${pkg}"

          cp build/moroder "dist/${pkg}/"
          cp build/libdiscord_partner_sdk.so "dist/${pkg}/"
          cp README.md "dist/${pkg}/"
          [ -f LICENSE ] && cp LICENSE "dist/${pkg}/" || true
          [ -f res/moroder.default.conf ] && cp res/moroder.default.conf "dist/${pkg}/" || true
          # Third-party attribution notices travel with the Discord .so
          [ -f lib/discord_social_sdk/License-Notices.txt ] && \
            cp lib/discord_social_sdk/License-Notices.txt "dist/${pkg}/" || true

          strip --strip-unneeded "dist/${pkg}/moroder"

          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          ( cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )
          ls -lh dist

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Moroder ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          # Draft: the artifacts are uploaded and waiting, but nothing is public
          # until you review the notes and press Publish. Set to false to skip
          # that step and go straight out.
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        run: |
          curl -sf -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK" <<EOF
          {"content": "🔥 Release build failed for \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF
