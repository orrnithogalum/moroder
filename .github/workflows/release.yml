name: Release

# You decide the version. Tag it locally, push the tag, and CI builds, packages
# and uploads. Nothing is released without you asking for it.
#
#   git tag -a v1.2.0 -m "Queue reordering, MPRIS seek fixes"
#   git push origin v1.2.0
#
# Or Actions -> Release -> Run workflow, and type a version: that tags the
# current commit of whichever branch you pick.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (with or without the v)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # to create the release and, for manual runs, the tag

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    # See ci.yml for why Debian 12 specifically.
    container:
      image: debian:12

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      DEBIAN_FRONTEND: noninteractive
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      # Resolve the version first, so a malformed tag fails in two seconds
      # rather than after a full build.
      - name: Resolve version
        id: ver
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ inputs.version }}"
          else
            raw="${{ github.ref_name }}"
          fi
          version="${raw#v}"

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$raw' is not a semantic version (expected 1.2.3 or v1.2.3)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install system packages
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git openssh-client \
            build-essential cmake ninja-build ccache pkg-config xxd binutils \
            libmpv-dev libcurl4-openssl-dev libsystemd-dev libx11-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Discord Social SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DISCORD_SDK_REPO }}
          ssh-key: ${{ secrets.DISCORD_SDK_DEPLOY_KEY }}
          path: lib/discord_social_sdk

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore dependency sources
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-bookworm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-bookworm-

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-release-bookworm-${{ github.sha }}
          restore-keys: ccache-release-bookworm-

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMORODER_VERSION="${{ steps.ver.outputs.version }}" \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the binary
        run: |
          set -eux
          test -f build/moroder
          test -f build/libdiscord_partner_sdk.so
          readelf -d build/moroder | grep -E 'RPATH|RUNPATH'
          ldd build/moroder
          # Highest glibc version demanded. Should be <= 2.36 on bookworm.
          objdump -T build/moroder | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eux
          pkg="moroder-${VERSION}-linux-x86_64"
          mkdir -p "dist/${pkg}"

          cp build/moroder "dist/${pkg}/"
          cp build/libdiscord_partner_sdk.so "dist/${pkg}/"
          cp README.md "dist/${pkg}/"
          [ -f LICENSE ] && cp LICENSE "dist/${pkg}/" || true
          [ -f res/moroder.default.conf ] && cp res/moroder.default.conf "dist/${pkg}/" || true
          # Third-party attribution notices travel with the Discord .so
          [ -f lib/discord_social_sdk/License-Notices.txt ] && \
            cp lib/discord_social_sdk/License-Notices.txt "dist/${pkg}/" || true

          strip --strip-unneeded "dist/${pkg}/moroder"

          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          ( cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )
          ls -lh dist

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Moroder ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          # Draft: artifacts are uploaded and waiting, but nothing is public
          # until you review the notes and press Publish. Set false to skip that.
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        run: |
          curl -sf -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK" <<EOF
          {"content": "🔥 Release build failed for \`${{ github.ref_name }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF
